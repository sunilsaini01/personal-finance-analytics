<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Card Transaction and Merchant Analytics banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#336791"/>
      <stop offset="100%" stop-color="#F2C811"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- simple bar-chart motif -->
  <g transform="translate(940,80)" opacity="0.9">
    <rect x="0"  y="120" width="26" height="60"  rx="3" fill="#336791"/>
    <rect x="36" y="90"  width="26" height="90"  rx="3" fill="#4f8fc0"/>
    <rect x="72" y="50"  width="26" height="130" rx="3" fill="#F2C811"/>
    <rect x="108" y="70" width="26" height="110" rx="3" fill="#e8b93e"/>
    <rect x="144" y="30" width="26" height="150" rx="3" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- database / star-schema motif -->
  <g transform="translate(80,150)" stroke="#F2C811" stroke-width="2" fill="none" opacity="0.8">
    <circle cx="0" cy="0" r="10" fill="#F2C811" stroke="none"/>
    <circle cx="-70" cy="-45" r="7" fill="#336791" stroke="none"/>
    <circle cx="70" cy="-45" r="7" fill="#336791" stroke="none"/>
    <circle cx="-70" cy="45" r="7" fill="#336791" stroke="none"/>
    <circle cx="70" cy="45" r="7" fill="#336791" stroke="none"/>
    <line x1="0" y1="0" x2="-70" y2="-45"/>
    <line x1="0" y1="0" x2="70" y2="-45"/>
    <line x1="0" y1="0" x2="-70" y2="45"/>
    <line x1="0" y1="0" x2="70" y2="45"/>
  </g>

  <text x="180" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">
    Card Transaction &amp; Merchant Analytics
  </text>
  <text x="180" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">
    PostgreSQL Star-Schema Data Warehouse  ·  12-Module SQL Analytics Library  ·  Power BI Dashboard
  </text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="600">
    <rect x="180" y="200" width="112" height="30" rx="15" fill="#336791"/>
    <text x="236" y="220" text-anchor="middle" fill="#ffffff">PostgreSQL</text>

    <rect x="302" y="200" width="86" height="30" rx="15" fill="#F2C811"/>
    <text x="345" y="220" text-anchor="middle">Power BI</text>

    <rect x="398" y="200" width="66" height="30" rx="15" fill="#e2e8f0"/>
    <text x="431" y="220" text-anchor="middle">SQL</text>

    <rect x="474" y="200" width="150" height="30" rx="15" fill="#334155"/>
    <text x="549" y="220" text-anchor="middle" fill="#f8fafc">13.3M+ Transactions</text>
  </g>
</svg>
